# This file is not used by the portfolio repository. GitHub Actions only
# loads workflows from the repository-root .github/workflows directory.
# The portfolio workflow is /.github/workflows/ml-ci.yml, which tests all
# seven projects. This copy remains so the project still documents a
# single-folder run if it is split out on its own.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest
